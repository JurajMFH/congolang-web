<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>congolang.cg - Under Construction</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Dark theme for a premium minimalist feel */
            color: #ffffff;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden; /* Prevent scrollbars from floating elements */
        }
        .floating-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .floating-lang {
            position: absolute;
            color: #ffffff;
            opacity: 0.12; /* Low opacity */
            font-weight: 700;
            white-space: nowrap;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(110vh);
                opacity: 0;
            }
            10% {
                opacity: 0.12;
            }
            90% {
                opacity: 0.12;
            }
            100% {
                transform: translateY(-20vh);
                opacity: 0;
            }
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo {
            max-width: 80%;
            width: 300px;
            height: auto;
            margin-bottom: 1.5rem;
        }
        .dynamic-text {
            font-size: 1.5rem;
            font-weight: 300;
            color: #cccccc;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            height: 2.5rem; /* Prevents jumping when text changes */
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="floating-bg" id="floatingBg"></div>
    <div class="container">
        <img src="assets/congolang_logo.png" alt="CongoLang Logo" class="logo">
        <div class="dynamic-text" id="dynamicText">Website under construction</div>
    </div>

    <script>
        const phrases = [
            "Na stránke sa pracuje", // Slovak
            "Website under construction", // English
            "Site en construction", // French
            "Сайт в разработке", // Russian
            "网站建设中", // Chinese
            "Mosala ezali kosalema awa", // Lingala
            "Kisalu ke salama awa", // Munukutuba
            "Salu yita salama", // Lari
            "Salu yi nsalama" // Vili
        ];

        let currentIndex = 1; // Start with index 1 because english is already shown
        const textElement = document.getElementById('dynamicText');

        setInterval(() => {
            textElement.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % phrases.length;
                textElement.textContent = phrases[currentIndex];
                textElement.style.opacity = 1;
            }, 500);
        }, 3000);

        // Floating languages background logic
        const backgroundLanguages = [
            "Lingala", "Munukutuba", "Lari", "Vili", "Mbochi", 
            "Teke", "Swahili", "Tshiluba", "English", "Français"
        ];
        
        const floatingBg = document.getElementById('floatingBg');
        
        function createFloatingLanguage() {
            const el = document.createElement('div');
            el.className = 'floating-lang';
            el.textContent = backgroundLanguages[Math.floor(Math.random() * backgroundLanguages.length)];
            
            // Randomize position, size, and animation duration
            el.style.left = Math.random() * 90 + '%'; // 0 to 90%
            
            const size = Math.random() * 2 + 1.5; // 1.5rem to 3.5rem
            el.style.fontSize = `${size}rem`;
            
            const duration = Math.random() * 20 + 15; // 15s to 35s
            el.style.animationDuration = `${duration}s`;
            
            floatingBg.appendChild(el);
            
            // Clean up after animation
            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }
        
        // Initial batch to populate the screen
        for(let i=0; i<12; i++) {
            setTimeout(createFloatingLanguage, Math.random() * 5000);
        }
        
        // Keep generating new ones over time
        setInterval(createFloatingLanguage, 2500);
    </script>
</body>
</html>
