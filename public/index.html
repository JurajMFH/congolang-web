<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>congolang.cg - Under Construction</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Dark theme for a premium minimalist feel */
            color: #ffffff;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ffffff, #aaaaaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dynamic-text {
            font-size: 1.5rem;
            font-weight: 300;
            color: #cccccc;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            height: 2.5rem; /* Prevents jumping when text changes */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">congolang.cg</div>
        <div class="dynamic-text" id="dynamicText">Website under construction</div>
    </div>

    <script>
        const phrases = [
            "Na stránke sa pracuje", // Slovak
            "Website under construction", // English
            "Site en construction", // French
            "Сайт в разработке", // Russian
            "网站建设中", // Chinese
            "Mosala ezali kosalema awa", // Lingala
            "Kisalu ke salama awa", // Munukutuba
            "Salu yita salama", // Lari
            "Salu yi nsalama" // Vili
        ];

        let currentIndex = 1; // Start with index 1 because english is already shown
        const textElement = document.getElementById('dynamicText');

        setInterval(() => {
            textElement.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % phrases.length;
                textElement.textContent = phrases[currentIndex];
                textElement.style.opacity = 1;
            }, 500);
        }, 3000);
    </script>
</body>
</html>
